# CodeSphere production stack:
#
#   nginx (80/443) --> web (Gunicorn + Django :8000) --> sandbox containers
#                                                        (one per run, from
#                                                         the runner image)
#
# Local:  cp .env.example .env && docker compose up --build
# EC2:    see DEPLOYMENT.md (images are pulled from Amazon ECR)

services:
  # Builds/pulls the sandbox image; it exits immediately. The web service
  # starts one short-lived container from this image per code execution.
  runner:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    image: ${RUNNER_IMAGE:-codesphere-runner:latest}
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  web:
    build:
      context: ./backend
    image: ${WEB_IMAGE:-codesphere-web:latest}
    env_file: .env
    environment:
      SANDBOX_BACKEND: docker
      SANDBOX_IMAGE: ${RUNNER_IMAGE:-codesphere-runner:latest}
      # Must be the SAME path on the host and in this container, because the
      # host's Docker daemon bind-mounts it into each sandbox container.
      SANDBOX_WORK_DIR: /var/lib/codesphere/runs
      DJANGO_DATA_DIR: /data
      DJANGO_STATIC_ROOT: /app/staticfiles
    volumes:
      - app-data:/data                                  # SQLite DB + test cases
      - static:/app/staticfiles                         # shared with nginx
      - /var/run/docker.sock:/var/run/docker.sock       # start sandbox containers
      - /var/lib/codesphere/runs:/var/lib/codesphere/runs
    group_add:
      - "${DOCKER_GID:-999}"                            # access to docker.sock
    expose:
      - "8000"
    depends_on:
      runner:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/${NGINX_CONF:-local.conf}:/etc/nginx/conf.d/default.conf:ro
      - static:/var/www/static:ro
      - certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app-data:
  static:
  certbot-www:
