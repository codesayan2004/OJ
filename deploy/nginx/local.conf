# Nginx reverse proxy for CodeSphere over plain HTTP.
# Used for local testing and for the first boot on EC2, before the
# Let's Encrypt certificate exists (deploy/init_letsencrypt.sh).

limit_req_zone $binary_remote_addr zone=judge:10m rate=30r/m;

upstream codesphere_web {
    server web:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        return 404;
    }

    location ~ ^/problems/\d+/(run|submit|ai_review)/$ {
        limit_req zone=judge burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://codesphere_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://codesphere_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
