# Nginx reverse proxy for CodeSphere (production, HTTPS).
# Mounted into the nginx container as /etc/nginx/conf.d/default.conf.
#
#   client --HTTPS--> Nginx :443 --HTTP--> Gunicorn (web:8000) --> Django
#
# Nginx terminates TLS (Let's Encrypt), serves /static/ straight from disk,
# rate-limits the run/submit endpoints and forwards everything else.

# 10 run/submit requests per minute per IP, small burst allowed.
limit_req_zone $binary_remote_addr zone=judge:10m rate=10r/m;

upstream codesphere_web {
    server web:8000;
    keepalive 16;
}

# HTTP: only the Let's Encrypt challenge, everything else -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name codespher.me www.codespher.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name codespher.me www.codespher.me;

    ssl_certificate     /etc/letsencrypt/live/codespher.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codespher.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 10m;   # test-case uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Static files collected by `manage.py collectstatic`.
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
    }

    # Uploaded test cases are hidden data: never served directly.
    location /media/ {
        return 404;
    }

    # Code execution is expensive: rate-limit it per client IP.
    location ~ ^/problems/\d+/(run|submit|ai_review)/$ {
        limit_req zone=judge burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://codesphere_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;   # matches Gunicorn's timeout
    }

    location / {
        proxy_pass http://codesphere_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
